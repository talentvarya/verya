services:
  - type: web
    name: veyra-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VEYRA_OTP_MODE
        value: auto
      - key: SMSLOCAL_API_KEY
        sync: false
      - key: SMSLOCAL_SENDER_ID
        sync: false
      - key: SMSLOCAL_DLT_TEMPLATE_ID
        sync: false
